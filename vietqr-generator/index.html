<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VietQR Generator - MB Bank</title>
  <meta name="description" content="Công cụ tạo mã VietQR chuyển khoản ngân hàng offline chuẩn NAPAS 247, hỗ trợ MB Bank" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface-2: #24243a;
      --border: #2e2e48;
      --text: #e8e8f0;
      --text-muted: #9090b0;
      --accent: #5b7cfa;
      --accent-glow: rgba(91,124,250,.25);
      --green: #34d399;
      --radius: 14px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(91,124,250,.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(52,211,153,.05) 0%, transparent 60%);
    }
    .card {
      max-width: 500px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.6);
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    h1 small {
      font-size: .75rem;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: .15rem .5rem;
      border-radius: 99px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: .85rem;
      margin-top: .3rem;
      margin-bottom: 1.5rem;
    }
    .bank-badge {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--surface-2);
      border-radius: 10px;
      padding: .75rem 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .bank-badge .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #e11d2f, #cc1a2a);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: .7rem;
      flex-shrink: 0;
    }
    .bank-badge .info { flex: 1; min-width: 0; }
    .bank-badge .name { font-weight: 600; font-size: .9rem; }
    .bank-badge .detail {
      color: var(--text-muted);
      font-size: .8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: .35rem;
    }
    input, textarea {
      width: 100%;
      padding: .65rem .85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .9rem;
      font-family: var(--font);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    textarea { resize: vertical; min-height: 60px; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .btn {
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
      font-family: var(--font);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, #5b7cfa, #7c5bfa);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); }
    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
      box-shadow: 0 4px 14px rgba(52,211,153,.25);
      margin-top: .75rem;
    }
    .btn-success:hover { box-shadow: 0 6px 24px rgba(52,211,153,.3); }
    .qr-section {
      display: none;
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      animation: fadeUp .4s ease;
    }
    .qr-section.visible { display: block; }
    .qr-wrapper {
      display: inline-flex;
      padding: 1rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .qr-wrapper canvas, .qr-wrapper img { display: block; max-width: 100%; height: auto; }
    .qr-info {
      margin-top: .75rem;
      color: var(--text-muted);
      font-size: .8rem;
    }
    .qr-info strong { color: var(--text); }
    .payload-display {
      margin-top: .75rem;
      padding: .5rem .75rem;
      background: var(--surface-2);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: .65rem;
      color: var(--text-muted);
      word-break: break-all;
      text-align: left;
      cursor: pointer;
      transition: .2s;
    }
    .payload-display:hover { color: var(--text); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: .6rem 1.2rem;
      border-radius: 10px;
      font-size: .85rem;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 10;
    }
    .toast.show { opacity: 1; }
    .note {
      margin-top: 1rem;
      font-size: .75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🏦 VietQR <small>Chuẩn NAPAS</small></h1>
    <p class="subtitle">Tạo mã QR chuyển khoản — offline, đúng chuẩn ngân hàng</p>

    <div class="bank-badge">
      <div class="logo">MB</div>
      <div class="info">
        <div class="name">Ngân hàng TMCP Quân Đội (MB Bank)</div>
        <div class="detail">8888687939 · HO KINH DOANH CHE BUOI AN GIANG</div>
      </div>
    </div>

    <div class="form-group">
      <label for="amount">💰 Số tiền (VND)</label>
      <input type="number" id="amount" placeholder="Nhập số tiền…" min="0" />
    </div>

    <div class="form-group">
      <label for="message">📝 Nội dung chuyển khoản</label>
      <textarea id="message" placeholder="Thanh toán đơn hàng..."></textarea>
    </div>

    <button class="btn btn-primary" id="generateBtn">✨ Tạo mã QR</button>

    <div class="qr-section" id="qrSection">
      <div class="qr-wrapper" id="qrWrapper"></div>
      <div class="qr-info">
        <span id="qrAmount">0 ₫</span> · <span id="qrMessage">—</span>
      </div>
      <div class="payload-display" id="payloadDisplay"></div>
      <button class="btn btn-success" id="downloadBtn">📥 Tải xuống PNG</button>
    </div>

    <div class="note">
      ✅ Chuẩn NAPAS 247 · Dùng được với Momo, MB Bank, tất cả app ngân hàng
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // ── Config ──
    const BANK_BIN = '970422';        // MB Bank BIN
    const ACCOUNT_NO = '8888687939';
    const ACCOUNT_NAME = 'HO KINH DOANH CHE BUOI AN GIANG';

    // ── DOM refs ──
    const $amount = document.getElementById('amount');
    const $message = document.getElementById('message');
    const $generateBtn = document.getElementById('generateBtn');
    const $qrSection = document.getElementById('qrSection');
    const $qrWrapper = document.getElementById('qrWrapper');
    const $qrAmount = document.getElementById('qrAmount');
    const $qrMessage = document.getElementById('qrMessage');
    const $payloadDisplay = document.getElementById('payloadDisplay');
    const $downloadBtn = document.getElementById('downloadBtn');
    const $toast = document.getElementById('toast');

    let qrCodeInstance = null;
    let toastTimer = null;

    // ── CRC16 ──
    function crc16(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
          else crc = crc << 1;
        }
      }
      return (crc & 0xFFFF).toString(16).padStart(4, '0').toUpperCase();
    }

    function pad2(n) { return n.toString().padStart(2, '0'); }

    // ── Build VietQR content (đúng chuẩn NAPAS 247) ──
    function buildContent(bankBin, accountNo, amount, message) {
      let v = '000201010211'; // Version 1 + Static QR

      // ── Merchant Account Information (ID 38) ──
      const sub01Content =
        '00' + pad2(String(bankBin).length) + bankBin +
        '01' + pad2(String(accountNo).length) + accountNo;

      const sub01 = '01' + pad2(sub01Content.length) + sub01Content;

      const merchantInfo = '0010A000000727' + sub01 + '0208QRIBFTTA';

      v += '38' + pad2(merchantInfo.length) + merchantInfo;

      // ── Transaction Currency ──
      v += '5303704'; // VND

      // ── Transaction Amount (optional) ──
      if (amount > 0) {
        const amtStr = String(amount);
        v += '54' + pad2(amtStr.length) + amtStr;
      }

      // ── Country Code ──
      v += '5802VN';

      // ── Additional Data (optional) ──
      if (message && message.trim()) {
        const msg = message.trim();
        const addData = '08' + pad2(msg.length) + msg;
        v += '62' + pad2(addData.length) + addData;
      }

      // ── CRC ──
      v += '6304' + crc16(v);

      return v;
    }

    // ── Generate QR ──
    function generateQR() {
      const amount = parseFloat($amount.value) || 0;
      const message = $message.value.trim();

      if (amount <= 0) {
        showToast('⚠️ Vui lòng nhập số tiền lớn hơn 0');
        return;
      }

      const content = buildContent(BANK_BIN, ACCOUNT_NO, amount, message);

      // Clear old QR
      $qrWrapper.innerHTML = '';
      if (qrCodeInstance) {
        try { qrCodeInstance.clear(); } catch(e) {}
        qrCodeInstance = null;
      }

      // Create QR
      qrCodeInstance = new QRCode($qrWrapper, {
        text: content,
        width: 220,
        height: 220,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });

      // Update info
      $qrAmount.textContent = amount.toLocaleString('vi-VN') + ' ₫';
      $qrMessage.textContent = message || '(không có nội dung)';
      $payloadDisplay.textContent = '🔍 ' + content;

      // Show
      $qrSection.classList.add('visible');
      $qrSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      showToast('✅ Đã tạo mã QR! Quét thử với Momo / MB Bank nhé!');
    }

    // ── Download PNG ──
    function downloadQR() {
      const canvas = $qrWrapper.querySelector('canvas');
      if (!canvas) { showToast('⚠️ Chưa có mã QR để tải'); return; }
      const link = document.createElement('a');
      link.download = `vietqr-mb-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('📥 Đã tải xuống!');
    }

    // ── Copy payload on click ──
    $payloadDisplay.addEventListener('click', function() {
      const text = this.textContent.replace('🔍 ', '');
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 Đã copy payload!');
      }).catch(() => {});
    });

    // ── Toast ──
    function showToast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $toast.classList.remove('show'), 3000);
    }

    // ── Events ──
    $amount.addEventListener('input', function() {
      if (this.value.length > 1 && this.value.startsWith('0')) {
        this.value = this.value.replace(/^0+/, '');
      }
    });

    $generateBtn.addEventListener('click', generateQR);
    $downloadBtn.addEventListener('click', downloadQR);

    $amount.addEventListener('keydown', e => { if (e.key === 'Enter') generateQR(); });
    $message.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generateQR(); } });

    // ── Init ──
    window.addEventListener('load', () => {
      $amount.value = '50000';
    });

    console.log('🏦 VietQR NAPAS ready! MB Bank · ' + ACCOUNT_NO);
  </script>
</body>
</html>
