# A generic, single database configuration.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://postgres.nyormgswqejwbwbuhkiy:Posa%%402026Secure!@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
