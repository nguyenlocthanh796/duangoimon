upstream go_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# ==============================================================================
# QUY TẮC BĂNG THÔNG TỔNG (GLOBAL BANDWIDTH CEILING): TRẦN CỨNG 20 Mbps (2.5 MB/s)
# - 1 người tải: nhận trọn 20 Mbps (~2.5 MB/s).
# - 100 người tải: tự chia đều từ pool 20 Mbps, server không bao giờ nhả quá 20 Mbps.
# ==============================================================================
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# 1. HTTP -> HTTPS REDIRECT CHO MỌI DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name ongchu.cloud www.ongchu.cloud app.ongchu.cloud;
    return 301 https://$host$request_uri;
}

# 2. APP.ONGCHU.CLOUD — PORTAL POS BÁN HÀNG EXPO SDK 52 SINGLE PAGE APP
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ongchu.cloud;

    ssl_certificate /etc/letsencrypt/live/ongchu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ongchu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_APP:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    root /var/www/ongchu-app;
    gzip_static on;
    index index.html;

    tcp_nodelay on;
    charset utf-8;
    charset_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    location /health {
        proxy_pass http://go_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://go_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Public e-Receipt & Tra Cuu Bill Portal
    location ~ ^/(b|bill|tra-cuu|check-bill)(/|$) {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Realtime Sync Hub
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Strict No-Cache for HTML/SPA fallback
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Expo Static Assets & JS Bundles with gzip_static and smart fallback
    location /_expo/static/js/web/ {
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri /_expo/static/js/web/entry-dd5fa7a3f62f1f98605716b2a4caa94f.js =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg|ttf|otf|eot)$ {
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# 3. ONGCHU.CLOUD & WWW.ONGCHU.CLOUD — TRANG GIỚI THIỆU, QUẢNG BÁ & TẢI BẢN
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ongchu.cloud www.ongchu.cloud;

    ssl_certificate /etc/letsencrypt/live/ongchu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ongchu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_LANDING:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    root /var/www/ongchu-landing;
    index index.html;

    tcp_nodelay on;
    charset utf-8;
    charset_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Chuyển hướng /login hoặc /pos sang Web POS App
    location ~ ^/(login|pos|thanh-toan|kds|bao-cao-loi-nhuan|so-quy|giao-ca|hoa-don|thuc-don|cai-dat|cfd)(/|$) {
        return 302 https://app.ongchu.cloud$request_uri;
    }

    location /health {
        proxy_pass http://go_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://go_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public e-Receipt & Tra Cuu Bill Portal
    location ~ ^/(b|bill|tra-cuu|check-bill)(/|$) {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # KHU VỰC TẢI FILE CÀI ĐẶT & METADATA (APK, IPA, PLIST, EXE, VERSION JSON)
    location /downloads/ {
        alias /var/www/ongchu-landing/downloads/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Hỗ trợ Range Requests (Resume tải dở)
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "*" always;

        location ~* \.apk$ {
            types { application/vnd.android.package-archive apk; }
            default_type application/vnd.android.package-archive;
            limit_conn perip_conn 3;
            limit_rate 3500k;
            add_header Content-Disposition "attachment; filename=\"ongchu-pos-release.apk\"" always;
            expires 7d;
        }

        location ~* \.ipa$ {
            types { application/octet-stream ipa; }
            default_type application/octet-stream;
            limit_conn perip_conn 3;
            limit_rate 3500k;
            add_header Content-Disposition "attachment; filename=\"ongchu-pos-release.ipa\"" always;
            expires 7d;
        }

        location ~* \.(exe|zip|dmg)$ {
            limit_conn perip_conn 3;
            limit_rate 3500k;
            add_header Content-Disposition "attachment" always;
            expires 7d;
        }

        location ~* \.plist$ {
            types { application/xml plist; }
            default_type application/xml;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }

        location ~* \.json$ {
            types { application/json json; }
            default_type application/json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }
    }

    # Location fallback cho các file tải trực tiếp theo đuôi mở rộng
    location ~* \.(apk|ipa|exe|zip|dmg)$ {
        limit_conn perip_conn 3;
        limit_rate 3500k;
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "attachment" always;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
