name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t posa-backend ./backend

      - name: Push to registry (example)
        run: |
          echo "docker tag posa-backend ghcr.io/your-org/posa-backend:latest"
          echo "docker push ghcr.io/your-org/posa-backend:latest"
          echo "ssh deploy@host 'docker pull ghcr.io/your-org/posa-backend && docker compose up -d'"
