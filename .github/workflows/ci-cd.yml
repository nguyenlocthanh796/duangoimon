name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    
    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run lint
      working-directory: backend
      run: |
        python -m flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pos_db_test
        SECRET_KEY: ci-test-secret-key-32-chars-minimum-required
        HARDCODED_PASS: ci-test-password
      run: |
        python -m alembic upgrade head
        python -m pytest -v --tb=short --junit-xml=test-results.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: backend/test-results.xml

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: TypeScript check
      working-directory: frontend
      run: npx tsc --noEmit || true
    
    - name: npm audit
      working-directory: frontend
      continue-on-error: true
      run: npm audit --audit-level=moderate

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit SAST
      working-directory: backend
      run: bandit -r app --quiet --exit-zero || true
    
    - name: Run Safety dependency check
      working-directory: backend
      continue-on-error: true
      run: safety check --json || echo "safety check completed"
